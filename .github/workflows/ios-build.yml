name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: AQR360
  BUNDLE_ID: com.aqr360.app

jobs:
  lint:
    name: Structural lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run lint

  build:
    name: Build (simulator)
    # macOS 26 ships Xcode 26.x with the iOS 26 SDK. Liquid Glass
    # (.glassEffect, .glass, GlassEffectContainer) does not exist in the
    # Xcode 16 SDK, and `#available` cannot gate symbols the SDK lacks —
    # so the runner has to carry a matching SDK.
    runs-on: macos-26
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphonesimulator | tail -1

      - name: List schemes
        run: xcodebuild -list -project AQR360.xcodeproj

      # Signless simulator build: catches every compile and link error without
      # needing an Apple Developer account or a provisioning profile.
      - name: Build
        env:
          DERIVED: ${{ runner.temp }}/build
        run: |
          set -o pipefail
          xcodebuild build \
            -project AQR360.xcodeproj \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: AQR360-simulator-build
          path: ${{ runner.temp }}/build/Build/Products/Debug-iphonesimulator/${{ env.SCHEME }}.app
          retention-days: 7
          if-no-files-found: error

  screenshots:
    name: Screenshots
    runs-on: macos-26
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: AQR360-simulator-build
          path: app

      - name: Build
        env:
          DERIVED: ${{ runner.temp }}/build
        run: |
          set -o pipefail
          xcodebuild build \
            -project AQR360.xcodeproj \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify

      - name: Boot simulator
        run: |
          set -euo pipefail
          # macOS runners have no GNU `timeout` (`timeout: command not found`).
          # perl ships in the image, so bound calls with it instead.
          bounded() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          DEVICE=$(xcrun simctl list devices available \
            | grep -E 'iPhone 17 Pro \(' | head -1 | grep -oE '[0-9A-F-]{36}')
          if [ -z "$DEVICE" ]; then
            DEVICE=$(xcrun simctl list devices available | grep -E 'iPhone' | head -1 | grep -oE '[0-9A-F-]{36}')
          fi
          echo "Using $DEVICE"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          # Bounded: bootstatus can wait indefinitely on a wedged runtime.
          bounded 300 xcrun simctl bootstatus "$DEVICE" -b
          # Headless capture: do NOT `open -a Simulator`. The app GUI is not
          # needed for `simctl io screenshot`, and launching it can wedge the
          # display server in CI.
          bounded 60 xcrun simctl status_bar "$DEVICE" override \
            --time "9:41" --batteryState charged --batteryLevel 100 \
            --wifiBars 3 --cellularBars 4 || echo "status bar override skipped"

      - name: Install
        run: |
          set -euo pipefail
          bounded() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          APP="$RUNNER_TEMP/build/Build/Products/Debug-iphonesimulator/$SCHEME.app"
          test -d "$APP" || { echo "missing $APP"; exit 1; }
          bounded 120 xcrun simctl install "$DEVICE" "$APP"
          echo "installed $BUNDLE_ID"

      # One screenshot per tab. The app opens straight to the tab named by
      # -startTab, so this drives the real app rather than simulating taps.
      # Every simctl call is bounded: a hung `io screenshot` would otherwise
      # stall the job until the 6h job timeout.
      - name: Capture tabs
        run: |
          set -uo pipefail
          bounded() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          mkdir -p screenshots
          for TAB in home market assets services account; do
            xcrun simctl terminate "$DEVICE" "$BUNDLE_ID" 2>/dev/null || true
            bounded 60 xcrun simctl launch "$DEVICE" "$BUNDLE_ID" -startTab "$TAB" \
              || { echo "launch failed for $TAB"; continue; }
            sleep 7
            if bounded 90 xcrun simctl io "$DEVICE" screenshot "screenshots/$TAB.png"; then
              echo "captured $TAB"
            else
              echo "screenshot FAILED for $TAB"
            fi
          done
          ls -l screenshots || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
          retention-days: 14
          if-no-files-found: warn

      # Publish the review site. The screenshots are already in hand from the
      # step above, so this does not re-run a simulator.
      #
      # The page serves the real captured pixels with a tab bar rather than a
      # hand-written HTML reimplementation — that way the preview cannot drift
      # from the SwiftUI source, which is the whole point.
      - name: Assemble preview site
        if: always()
        run: |
          mkdir -p _site/screenshots
          cp preview/index.html _site/index.html
          cp screenshots/*.png _site/screenshots/ 2>/dev/null || true
          ls -l _site _site/screenshots

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: always()
        uses: actions/deploy-pages@v4
        id: deploy